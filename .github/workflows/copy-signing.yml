name: Copy signing key to cottonvpn-android (one-off)

# Разовая задача: ключ подписи живёт только в секретах этого репозитория (файлы на сервере
# потерялись при переезде 2026-09-17). Копируем его в новое приложение, не выводя наружу.
on:
  workflow_dispatch: {}

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Copy secrets
        env:
          GH_TOKEN: ${{ secrets.COPY_TOKEN }}
          KS: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          R=CottonVPN/cottonvpn-android
          printf '%s' "$KS"    | gh secret set SIGNING_KEYSTORE_B64 -R "$R"
          printf '%s' "$ALIAS" | gh secret set KEYSTORE_ALIAS -R "$R"
          printf '%s' "$PASS"  | gh secret set KEYSTORE_PASS -R "$R"
          echo "copied: keystore ${#KS} chars, alias ${#ALIAS} chars, pass ${#PASS} chars"
